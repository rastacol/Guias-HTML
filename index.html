<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guías de IA — rastacol</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --bg2:       #242424;
      --border:    #2e2e2e;
      --text:      #e0e0e0;
      --text3:     #888;
      --text4:     #555;
      --accent:    #5c8ee0;
      --sidebar-w: 220px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
    }

    /* ── TOPBAR móvil ── */
    .topbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 50px;
    }

    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
    }
    .hamburger svg { width: 20px; height: 20px; fill: currentColor; }
    .topbar-title { font-size: 14px; font-weight: 600; color: var(--text); }

    /* ── OVERLAY móvil ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
    }
    .overlay.visible { display: block; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .sidebar-sub   { font-size: 11px; color: var(--text4); }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text4);
      padding: 16px 20px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      font-size: 13px;
      color: var(--text3);
      cursor: pointer;
      border-left: 2px solid transparent;
      text-decoration: none;
      transition: color 0.15s, background 0.15s;
      user-select: none;
    }

    .nav-item:hover  { color: var(--text); background: var(--bg2); }
    .nav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--bg2); }
    .nav-item .nav-icon { font-size: 14px; min-width: 18px; text-align: center; }

    .nav-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    /* ── IFRAME ── */
    .content {
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .topbar { display: flex; }

      .layout { margin-top: 50px; height: calc(100vh - 50px); }

      .sidebar {
        position: fixed;
        top: 50px;
        left: 0;
        height: calc(100vh - 50px);
        z-index: 200;
        background: var(--bg);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.open { transform: translateX(0); }

      .content { height: calc(100vh - 50px); }
    }
  </style>
</head>
<body>

  <!-- Topbar móvil -->
  <div class="topbar">
    <button class="hamburger" id="menuBtn" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <span class="topbar-title">Guías de IA</span>
  </div>

  <!-- Overlay móvil -->
  <div class="overlay" id="overlay"></div>

  <div class="layout">

    <!-- Sidebar fijo -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Guías de IA</div>
        <div class="sidebar-sub">rastacol · 2026</div>
      </div>

      <div class="nav-label">Categorías</div>

      <div class="nav-item active" data-src="guia_prompts.html">
        <span class="nav-icon">🧱</span> Estructuración de Prompts
      </div>
      <div class="nav-item" data-src="steering_questions.html">
        <span class="nav-icon">🎯</span> Preguntas Steering
      </div>
      <div class="nav-item" data-src="tono.html">
        <span class="nav-icon">🎨</span> Tonos
      </div>
      <div class="nav-item" data-src="puntos-de-restauracion.html">
        <span class="nav-icon">📍</span> Puntos de Restauración
      </div>
      <div class="nav-item" data-src="skill_prompts.html">
        <span class="nav-icon">⚙️</span> Gestión de Skills
      </div>
      <div class="nav-item" data-src="recursos.html">
        <span class="nav-icon">🔗</span> Recursos
      </div>

      <hr class="nav-divider">

      <div class="nav-label">Repositorio</div>
      <a class="nav-item" href="https://github.com/rastacol/Guias-HTML" target="_blank">
        <span class="nav-icon">↗</span> Ver en GitHub
      </a>
    </nav>

    <!-- Contenido — iframe -->
    <div class="content">
      <iframe id="guiaFrame" src="guia_prompts.html" title="Guía"></iframe>
    </div>

  </div>

  <script>
    const frame   = document.getElementById('guiaFrame');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    const navItems = document.querySelectorAll('.nav-item[data-src]');

    // Navegación por iframe
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        frame.src = item.dataset.src;
        if (window.innerWidth <= 640) closeSidebar();
      });
    });

    // Sidebar móvil
    function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('visible'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); }

    menuBtn.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>

</body>
</html>
